[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gnani"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "websockets>=15.0.1,<16",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-socket>=0.7,<1",
    "ruff>=0.15,<0.16",
    "mypy>=1.19,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: paid Gnani API tests", "hermes: tests requiring the pinned Hermes host"]

[tool.ruff]
target-version = "py314"
line-length = 105

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["gnani"]

[tool.setuptools.package-data]
gnani = ["plugin.yaml"]
